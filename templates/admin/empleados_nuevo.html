{% extends 'layout.html' %}
{% block content %}
<div class="page-header">
    <h1>➕ Registrar Empleado</h1>
    <p>Agregar un nuevo miembro al equipo</p>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <form method="POST">
        <h4 style="color: var(--primary); margin-bottom: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">👤 Datos Personales</h4>
        <div class="grid-2">
            <div class="form-group">
                <label>Tipo de Documento</label>
                <select class="form-control" name="tipo_documento" required>
                    <option value="CEDULA">Cédula</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>
            </div>
            <div class="form-group">
                <label>Número de Documento</label>
                <input type="text" class="form-control" name="numero_documento" required>
            </div>
            <div class="form-group">
                <label>Nombres</label>
                <input type="text" class="form-control" name="nombres" required>
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" class="form-control" name="apellidos" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" name="email">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" class="form-control" name="telefono">
            </div>
            <div class="form-group">
                <label>Fecha de Nacimiento</label>
                <input type="date" class="form-control" name="fecha_nacimiento">
            </div>
            <div class="form-group">
                <label>Nacionalidad</label>
                <select class="form-control" name="nacionalidad">
                    {% for p in paises %}
                    <option value="{{ p.codigo_iso }}" {{ 'selected' if p.codigo_iso == 'EC' }}>{{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Género</label>
                <select class="form-control" name="genero">
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>
        </div>

        <h4 style="color: var(--primary); margin: 1.5rem 0 1rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">💼 Datos Laborales</h4>
        <div class="grid-2">
            <div class="form-group">
                <label>Código de Empleado</label>
                <input type="text" class="form-control" name="codigo_empleado" placeholder="EMP-001" required>
            </div>
            <div class="form-group">
                <label>Cargo</label>
                <select class="form-control" name="cargo" id="cargo_select" required onchange="toggleLicencia()">
                    <option value="PILOTO">👨✈️ Piloto</option>
                    <option value="COPILOTO">👨✈️ Copiloto</option>
                    <option value="SOBRECARGO">👩✈️ Sobrecargo</option>
                    <option value="AGENTE_CHECKIN">💻 Agente de Check-in</option>
                    <option value="AGENTE_PUERTA">🚪 Agente de Puerta</option>
                    <option value="SUPERVISOR_VUELOS">📊 Supervisor de Vuelos</option>
                    <option value="ADMINISTRADOR">🔧 Administrador</option>
                </select>
            </div>
            <div class="form-group" id="licencia_group">
                <label>Número de Licencia</label>
                <input type="text" class="form-control" name="numero_licencia" placeholder="ATP-EC-12345">
                <small class="text-muted">Solo para pilotos y copilotos</small>
            </div>
            <div class="form-group">
                <label>Fecha de Contratación</label>
                <input type="date" class="form-control" name="fecha_contratacion" required>
            </div>
            <div class="form-group">
                <label>Salario Mensual ($)</label>
                <input type="number" class="form-control" name="salario" step="0.01" min="0" value="1500.00">
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">✅ Registrar Empleado</button>
            <a href="{{ url_for('admin_empleados') }}" class="btn btn-outline" style="margin-left: 1rem;">← Cancelar</a>
        </div>
    </form>
</div>

<script>
function toggleLicencia() {
    const cargo = document.getElementById('cargo_select').value;
    const licenciaGroup = document.getElementById('licencia_group');
    licenciaGroup.style.display = ['PILOTO', 'COPILOTO'].includes(cargo) ? 'block' : 'none';
}
toggleLicencia();
</script>
{% endblock %}
